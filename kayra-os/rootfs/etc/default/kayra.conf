# Kayra OS system-wide defaults.
# Root owned and world readable. Read by the user scripts via system_conf_get()
# (settings-conf.sh); this is not a user preference file.

# System groups a desktop user must belong to. Space separated list read by
# kayra-check-groups.sh, kayra-fix-groups.sh and kayra-group-remove.sh.
# Groups that do not exist on the system are ignored. Users enable or disable
# enforcement with the auto_group_management key in ~/.config/kayra/settings.conf.
required_groups="users wheel disk floppy cdrom optical storage kvm audio video input dialout plugdev scanner usbmon lp lpadmin bluetooth socklog"

# Services that must stay running. Space separated list read by the
# kayra-system-services handler (key: protected_services). They can be started
# or enabled, but not stopped or restarted; the manager protects itself as well.
protected_services="dbus greetd socklog-unix nanoklogd polkitd kayra-system-services"

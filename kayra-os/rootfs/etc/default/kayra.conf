# Kayra OS system-wide defaults.
# Root owned and world readable. Read by the user scripts via system_conf_get()
# (settings-conf.sh); this is not a user preference file.

# Groups granted to the installation user on the first boot after install.
# Space separated list read by kayra-first-run-groups.sh, which also adds
# wheel and kayra-admin. Groups that do not exist on the system are ignored.
# The list is applied once; there is no later automatic group management.
# Keep wheel and the root-equivalent groups out of this list.
required_groups="users network audio video kvm plugdev scanner lp dialout optical cdrom floppy bluetooth"

# Services that must stay running. Space separated list read by the
# kayra-system-services handler (key: protected_services). They can be started
# or enabled, but not stopped or restarted; the manager protects itself as well.
protected_services="dbus greetd socklog-unix nanoklogd polkitd kayra-system-services kayra-group-services kayra-power-services kayra-locale-services"

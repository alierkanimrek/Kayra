# Kayra OS default portal backends for the sway session.
#
# xdg-desktop-portal-wlr implements only ScreenCast and Screenshot. Every
# other interface (FileChooser, Print, Access, Notification, Settings, ...)
# must come from xdg-desktop-portal-gtk.
#
# Void ships /usr/share/xdg-desktop-portal/portals.conf with "default=*",
# whose UseIn auto-selection never matches the gtk backend on sway
# (gtk.portal has UseIn=gnome only). This system wide override fixes that.
#
# A user can shadow this file with
# ~/.config/xdg-desktop-portal/portals.conf
# and a desktop specific file (sway-portals.conf) takes precedence over
# portals.conf in the same directory.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

{
  "group/app-pins": {
    "orientation": "horizontal",
    "modules": [
      "custom/app-pin-trigger",
      "image#app-pin-0",
      "image#app-pin-1",
      "image#app-pin-2",
      "image#app-pin-3",
      "image#app-pin-4",
      "image#app-pin-5",
      "image#app-pin-6",
      "image#app-pin-7",
      "image#app-pin-8",
      "image#app-pin-9"
    ]
  },
  "image#app-pin-0": {
    "exec": "$HOME/.local/bin/waybar-app-pins.sh icon 0",
    "size": 20,
    "signal": 5,
    "on-click": "$HOME/.local/bin/waybar-app-pins.sh launch 0",
    "on-click-right": "$HOME/.local/bin/waybar-app-pins.sh remove 0"
  },
  "image#app-pin-1": {

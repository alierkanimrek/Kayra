# Kayra OS — Alacritty "Buz Neon" tema

[window]
opacity = 0.95
decorations = "None"
padding = { x = 10, y = 8 }

[font]
size = 12.0
offset = { x = 0, y = 1 }

[font.normal]
family = "Ubuntu Mono"
style = "Book"

[font.bold]
family = "Ubuntu Mono"
style = "Bold"

[font.italic]
family = "Ubuntu Mono"
style = "Oblique"

[font.bold_italic]
family = "Ubuntu Mono"
style = "Bold Oblique"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true

[colors.primary]
background = "#1b1e21"
foreground = "#cfeffa"

[colors.cursor]
text = "#1b1e21"
cursor = "#48e0ff"

[colors.selection]
text = "#1b1e21"
background = "#48e0ff"

[colors.normal]
black   = "#2a2e33"
red     = "#ff6b81"
green   = "#6cf2c0"
yellow  = "#ffe08a"
blue    = "#5ab8ff"
magenta = "#b48cff"
cyan    = "#48e0ff"
white   = "#cfeffa"

[colors.bright]
black   = "#4a4f56"
red     = "#ff8fa3"
green   = "#8ef9d4"
yellow  = "#ffe9b3"
blue    = "#7dcaff"
magenta = "#cbb0ff"
cyan    = "#7df6ff"
white   = "#ffffff"

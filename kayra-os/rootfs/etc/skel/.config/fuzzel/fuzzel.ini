[main]
# Yazı Tipi Ayarı
font=Noto Sans Mono:pixelsize=16
dpi-aware=no
layer=overlay
icons-enabled=yes
fields=name,categories
letter-spacing=1
inner-pad=5
match-mode=exact
minimal-lines=yes

# Konumlandırma Ayarları
anchor=top-right
y-margin=0
width=30

[colors]
background=2c2c2cff
text=f7f7f7ff
match=ffffffff
selection=e95420ff
selection-text=ffffffff
selection-match=f7f7f7ff
border=f7f7f7ff

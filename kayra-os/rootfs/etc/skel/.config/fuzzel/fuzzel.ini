[main]
# Font settings
font=Noto Sans Mono:pixelsize=16
dpi-aware=no
layer=overlay
icons-enabled=yes
fields=name,categories
letter-spacing=1
inner-pad=5
match-mode=exact
minimal-lines=yes

# Layout
anchor=top-right
y-margin=0
width=30

# Colors are generated by kayra-change-theme.sh.
include=~/.config/fuzzel/colors.ini

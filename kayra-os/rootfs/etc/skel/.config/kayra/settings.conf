# Kayra OS Settings Configuration
# Format: key=value
# This file can be sourced in bash scripts and edited with sed

# Font settings (used by appearance, system UI, terminal, etc.)
font="Noto Sans Mono"
font_size=14

auto_theme="true"

# Automatically check for package updates (true/false)
auto_update="true"

# Automatic group management (true/false). When true, the required system
# groups (see required_groups) are protected and cannot be removed with
# group-remove.sh. When false, the user is free to add or remove any group.
auto_group_management="true"

# DEBUG, INFO, WARN, ERROR, see klog.sh
log_level="DEBUG"

# System groups a desktop user must belong to. It is a space separated list
# read by check-groups.sh, fix-groups.sh and group-remove.sh (via
# settings-conf.sh). Groups that do not exist on the system are ignored.
required_groups="users wheel disk floppy cdrom optical storage kvm audio video input dialout plugdev scanner usbmon lp lpadmin bluetooth socklog"

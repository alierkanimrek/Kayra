# Kayra OS Settings Configuration
# Format: key=value
# This file can be sourced in bash scripts and edited with sed

# Font settings (used by appearance, system UI, terminal, etc.)
font="Noto Sans Mono"
font_size=14

auto_theme="true"
error_log_notify="false"
kayra_error_log_notify="true"

# DEBUG, INFO, WARN, ERROR, see klog.sh
log_level="DEBUG"

# Kayra OS Settings Configuration
# Format: key=value
# This file can be sourced in bash scripts and edited with sed

# UI language for i18n.sh: selects /usr/local/share/kayra/lang/<code>.sh.
# English (en) is the fallback when the code has no data file.
lang="tr"

# Font settings (used by appearance, system UI, terminal, etc.)
font="Noto Sans Mono"
font_size=14

# Terminal emulator used to run pinned commands (waybar-app-pins.sh)
terminal="alacritty -e"

auto_theme="true"

# Show the airplane-mode icon on the Waybar (true/false). The icon toggles
# rfkill (Wi-Fi and Bluetooth) when clicked.
plane_mode_icon="true"

# Automatically check for package updates (true/false)
auto_update="true"

# Automatic group management (true/false). When true, the required system
# groups (see /etc/default/kayra.conf) are protected in group-remove.sh and
# added automatically at login without a notification. When false, the user is
# free to add or remove any group and nothing is added automatically.
auto_group_management="true"

# DEBUG, INFO, WARN, ERROR, see klog.sh
log_level="DEBUG"

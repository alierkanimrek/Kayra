name: Kayra OS ISO Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc \
            xorriso squashfs-tools syslinux syslinux-utils \
            dosfstools parted mtools liblz4-tool wget

      - name: Bootstrap static xbps tools
        run: |
          wget https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          mkdir -p "$HOME/XBPS"
          tar xf xbps-static-latest.x86_64-musl.tar.xz -C "$HOME/XBPS"
          echo "$HOME/XBPS/usr/bin" >> "$GITHUB_PATH"

      - name: Clone void-mklive
        run: |
          git clone --depth=1 https://github.com/void-linux/void-mklive.git
          cd void-mklive
          make

      - name: Prepare Kayra OS Customizations
        run: |
          cd void-mklive
          mkdir -p dracut.new.root/etc/skel/.config/sway
          mkdir -p dracut.new.root/etc/skel/.config/waybar
          mkdir -p dracut.new.root/etc/skel/.config/xdg-desktop-portal
          mkdir -p dracut.new.root/etc/rc.local.d
          echo "flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo" > dracut.new.root/etc/rc.local.d/flatpak.sh
          chmod +x dracut.new.root/etc/rc.local.d/flatpak.sh
          echo "Kayra OS (Void Linux Based)" > dracut.new.root/etc/issue

      - name: Prepare void-installer
        run: |
          cd void-mklive
          mkdir -p installer-include/usr/bin
          VER=$(git describe --tags 2>/dev/null || echo custom)
          sed "s/@@MKLIVE_VERSION@@/${VER}/" installer.sh > installer-include/usr/bin/void-installer
          chmod 755 installer-include/usr/bin/void-installer

      - name: Build Kayra OS ISO
        run: |
          cd void-mklive
          sudo -E env "PATH=$PATH" ./mklive.sh -a x86_64 \
            -I installer-include \
            -p "sway xorg-server-xwayland alacritty fuzzel Waybar greetd polkit-gnome elogind NetworkManager mesa-dri flatpak xdg-desktop-portal-wlr cliphist wl-clipboard wireplumber network-manager-applet pavucontrol dialog cryptsetup lvm2 grub grub-x86_64-efi"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kayra-OS-Live-ISO
          path: void-mklive/*.iso
